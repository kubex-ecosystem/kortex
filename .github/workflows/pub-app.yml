name: Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: write
  deployments: write
  statuses: write

env:
  PUBLIC_URL: ${{ secrets.PUBLIC_URL || 'https://kortex.rafa-mori.dev/' }}

jobs:
  test:
    runs-on: ubuntu-latest
    if: github.actor == 'faelmori' || github.actor == 'dependabot[bot]' || github.actor == 'github-actions[bot]'
    name: Deploy Application
    steps:
      - name: Checkout Code
        uses: actions/checkout@v2
      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '22'
      - name: Install Dependencies
        run: |
          npm install
      - name: Build Application
        run: |
          npm run build
        env:
          CI: true
          NODE_ENV: production
          BUILD_VERSION: ${{ github.sha }}
          PUBLIC_URL: ${{ secrets.PUBLIC_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Run Tests
        run: |
          npm test
        env:
          CI: true
          PORT: 3000
          NODE_ENV: production
          BUILD_VERSION: ${{ github.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
  publish:
    needs: test
    if: github.actor == 'faelmori' || github.actor == 'dependabot[bot]' || github.actor == 'github-actions[bot]'
    name: Publish Application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v2
      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '22'

      - name: Cache Node Modules
        uses: actions/cache@v2
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-
            ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}

    ## <editor-fold desc="Optional Caching for Yarn or pnpm" defaultstate="collapsed">
    # - name: Cache Yarn
    #   uses: actions/cache@v2
    #   with:
    #     path: ~/.yarn-cache
    #     key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
    #     restore-keys: |
    #       ${{ runner.os }}-yarn-
    #       ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
    # - name: Cache pnpm
    #   uses: actions/cache@v2
    #   with:
    #     path: ~/.pnpm-store
    #     key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
    #     restore-keys: |
    #       ${{ runner.os }}-pnpm-
    #       ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
    #
    ## </editor-fold>

      - name: Cache Build Artifacts
        uses: actions/cache@v2
        with:
          path: dist
          key: ${{ runner.os }}-dist-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-dist-
            ${{ runner.os }}-dist-${{ hashFiles('**/package-lock.json') }}

      - name: Install Dependencies
        run: |
          if ! npm ci > /dev/null; then
            npm i -g npm
            npm i --no-fund --no-audit --prefer-offline
          fi
        env:
          CI: true
          NODE_ENV: production
          PUBLIC_URL: ${{ secrets.PUBLIC_URL }}
          BUILD_VERSION: ${{ github.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Build Artifacts
        uses: actions/cache@v2
        with:
          path: dist
          key: ${{ runner.os }}-dist-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-dist-
            ${{ runner.os }}-dist-${{ hashFiles('**/package-lock.json') }}

      - name: Build Application
        run: |
          npm run build
        env:
          CI: true
          NODE_ENV: production
          PUBLIC_URL: ${{ secrets.PUBLIC_URL }}
          BUILD_VERSION: ${{ github.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish Application
        run: |
          npm run publish
        env:
          CI: true
          NODE_ENV: production
          PUBLIC_URL: ${{ secrets.PUBLIC_URL }}
          BUILD_VERSION: ${{ github.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Finalize Publishing
        run: |
          echo "Finalizing publishing..."
          if [ -d "dist" ]; then
            echo "Cleaning up temporary files."
            npm run clean || true
            rm -rf node_modules || true
          fi
          echo "Publishing completed successfully."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLIC_URL: ${{ secrets.PUBLIC_URL }}
          BUILD_VERSION: ${{ github.sha }}
          CI: true
